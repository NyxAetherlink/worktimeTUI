[package]
name = "worktime-tui"
version = "0.1.0"
edition = "2024"
description = "CyberNord project timer and Pomodoro tracker"

[[bin]]
name = "worktimeTUI"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
